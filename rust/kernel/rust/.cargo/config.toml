# x86_64-weensyos.json is a custom target, so there's no prebuilt std for it;
# recompile core/alloc from source instead of using the shipped precompiled ones.

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

# Avoid passing --target on every `cargo build` invocation.
[build]
target = "x86_64-weensyos.json"
